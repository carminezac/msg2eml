name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test tests/Msg2Eml.Tests/Msg2Eml.Tests.csproj -c Release --logger "console;verbosity=normal"

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Tag must match Directory.Build.props
        run: |
          VER=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match <Version>$VER</Version> in Directory.Build.props"
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Publish self-contained binaries
        run: |
          set -e
          mkdir -p dist
          for RID in linux-x64 linux-arm64 win-x64 osx-x64 osx-arm64; do
            OUT="dist/msg2eml-$VERSION-$RID"
            dotnet publish src/Msg2Eml.Web/Msg2Eml.Web.csproj -c Release -r "$RID" -o "$OUT/msg2eml" --nologo -v q
            case "$RID" in
              win-*) (cd "$OUT" && zip -qr "../msg2eml-$VERSION-$RID.zip" msg2eml) ;;
              *)     tar -czf "$OUT.tar.gz" -C "$OUT" msg2eml ;;
            esac
            rm -rf "$OUT"
          done
          cp deploy/portainer-stack.yml deploy/portainer-stack.traefik.yml deploy/msg2eml.service dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Release notes
        run: |
          {
            echo "## Docker image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:$VERSION"
            echo '```'
            echo
            echo "Multi-arch (linux/amd64, linux/arm64). Portainer stack files and a systemd unit are attached."
            echo
            echo "## Binaries"
            echo
            echo "Self-contained, no .NET runtime required. Unpack and run \`msg2eml/Msg2Eml.Web\` (listens on http://localhost:8080; add \`--urls http://0.0.0.0:8080\` to expose it). Verify with \`sha256sum -c SHA256SUMS\`."
            echo
          } > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "msg2eml $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
