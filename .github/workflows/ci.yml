name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test tests/Msg2Eml.Tests/Msg2Eml.Tests.csproj -c Release --logger "console;verbosity=normal"

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Tag must match Directory.Build.props
        run: |
          VER=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match <Version>$VER</Version> in Directory.Build.props"
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"

      - name: Publish self-contained binaries
        run: |
          set -e
          mkdir -p dist
          publish() {  # <project> <artifact-name> <rid>
            OUT="dist/$2-$VERSION-$3"
            dotnet publish "$1" -c Release -r "$3" -o "$OUT/$2" --nologo -v q
            rm -f "$OUT/$2"/*.staticwebassets.endpoints.json
            case "$3" in
              win-*) (cd "$OUT" && zip -qr "../$2-$VERSION-$3.zip" "$2") ;;
              *)     tar -czf "$OUT.tar.gz" -C "$OUT" "$2" ;;
            esac
            rm -rf "$OUT"
          }
          # command line: every platform, including musl (Alpine)
          for RID in linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 win-x64 win-arm64 osx-x64 osx-arm64; do
            publish src/Msg2Eml.Cli/Msg2Eml.Cli.csproj msg2eml-cli "$RID"
          done
          # desktop window (loopback server + browser window): workstation platforms
          for RID in win-x64 win-arm64 osx-x64 osx-arm64 linux-x64; do
            publish src/Msg2Eml.Desktop/Msg2Eml.Desktop.csproj msg2eml-desktop "$RID"
          done
          # server without Docker: Linux hosts
          for RID in linux-x64 linux-arm64; do
            publish src/Msg2Eml.Server/Msg2Eml.Server.csproj msg2eml-server "$RID"
          done
          cp deploy/portainer-stack.yml deploy/portainer-stack.traefik.yml deploy/msg2eml.service dist/
          (cd dist && sha256sum * > SHA256SUMS)
          ls -la dist

      - name: Release notes
        run: |
          {
            echo "## Binaries (no .NET runtime, no Docker)"
            echo
            echo "- **msg2eml-desktop**: double-click, a window with the converter opens; nothing listens on the network (loopback only, random free port, no firewall prompt) and the program exits when the window is closed."
            echo "- **msg2eml-cli**: command line, \`msg2eml file.msg\` or whole directories; see \`msg2eml --help\`."
            echo "- **msg2eml-server**: the web service for Linux hosts without Docker; pair it with the attached systemd unit."
            echo
            echo "Linux builds need only glibc and libstdc++ (\`linux-musl\` builds for Alpine). Verify downloads with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "## Docker image"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:$VERSION"
            echo '```'
            echo
            echo "Multi-arch (linux/amd64, linux/arm64). Portainer stack files are attached."
            echo
          } > notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a re-pushed tag replaces its release instead of failing on "already exists"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "msg2eml $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
